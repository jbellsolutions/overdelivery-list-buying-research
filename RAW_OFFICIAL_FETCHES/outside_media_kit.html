<p class="text-plus-component">It’s Pretty Good</p>
<p class="text-plus-component">Welcome to The Outside Show</p>
<p class="text-plus-component">Hot takes, the latest happenings, rad guests, fresh gear—it’s all part of The Outside Show. Hang with hosts Mo Beck and Zoë Rom in the Outside gear garage live Wednesdays at 8 p.m. ET on Outside TV, or stream episodes on-demand.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/1cf6c25d6dc49d17d4bd5b11b23562db/processed-svg-morning-show-header23-1.svg" alt=""  class="image-component"/>
<p class="text-plus-component">MEET THE HOSTS</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/2aeadad8218ec333d2802dd09b3c559c/processed-svg-ellipse-1.svg" alt=""  class="image-component"/>
<p class="text-plus-component">MO BECK</p>
<p class="text-plus-component">Champion climber Maureen (“Mo”) Beck was born without her left hand but that didn’t stop her from picking up the sport of climbing at the age of 12. Mo has won nine national climbing titles and two world titles. Her 2018 attempt of Canada’s Lotus Flower Tower with fellow adaptive climber Jim Ewing earned Mo a National Geographic Adventurer of the Year. Retired from competition, Mo spends her time climbing all over the American southwest. </p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/5adfbe6a582dc92cb724b71d59edcf75/processed-svg-ellipse-1.svg" alt=""  class="image-component"/>
<p class="text-plus-component">NOAH COLLINS</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/bd9f273cda110cbed3a3cae33020765e/processed-svg-vector.svg" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/0b257ee61dae5dc687864f3ad203fcfa/processed-svg-vector.svg" alt=""  class="image-component"/>
<p class="text-plus-component">Colorado native Noah Collins is an exceptional cyclist, but not getting paid enough to cover the cost of his favorite coffee beans. So he earned degrees in biochemistry and exercise physiology, and now he trains elite cyclists while being way smarter than them. Too curious to be contained by lycra, Collins is also a successful business owner and a passionate outdoorsman who you’re as likely to find in the woods as on the road.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/9181b9b198baeb5cccc7cc4563508fda/processed-svg-ellipse-1.svg" alt=""  class="image-component"/>
<p class="text-plus-component">ZOË ROM</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/4811fe8d5525a65eab017bc7cf47e5f9/processed-svg-vector.svg" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2023/12/08/94b1589775df46225cd4b97043563cb1/processed-svg-vector.svg" alt=""  class="image-component"/>
<p class="text-plus-component">Zoë Rom is the Editor in Chief of Trail Runner and Managing Editor of Women’s Running. An elite ultrarunner with international podium finishes in distances from 50-100 miles, she likes to run very far not very fast. Heralded as "technically a comedian" by her accountant, she performs stand-up and improv in the Roaring Fork Valley. When she's not running, she's skiing. When she's not skiing, she's sleeping or eating. She likes expensive coffee and cheap whiskey.</p>
<img src="https://media.ceros.com/outside-mag/images/2024/01/16/8f2721c21c316289135001c35f9f68f6/processed-svg-rectangle-987.svg" alt=""  class="image-component"/>
<p class="text-plus-component">Curious how your brand can support—and be woven into—The Outside Show? We’d love to talk to you! Opportunities include:

 • Title, apparel, desk, and segment sponsorships
 • Earned media opportunities via athlete, brand, and product stories
 • Social-first and behind-the-scenes content
 • Distribution across all video platforms
 • Digital and video brand campaign support
 • Turnkey execution

Share ideas and feedback:
Have an idea for a story or guest we should cover on The Outside Show? Feedback on recent episodes? Drop us a line!</p>

<p class="text-plus-component">Paradox Sports</p>
<p class="text-plus-component">Helps the adaptive climbing community access wild places, athletic accomplishments, and personal growth through skills clinics, specialized training, and sponsored national park trips.
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/9a8f267fcf2265fac8c5806bf5ecdb76/40b8a4614c062ddbb430f1da7853f19f2f31cf54.png" alt=""  class="image-component"/>

<p class="text-plus-component">Access Fund</p>
<p class="text-plus-component">Protects public lands, restores impacted climbing areas, buys threatened land, and educates climbers and land managers alike about responsible stewardship.
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/d9bc5029703ca54e61202ddf2a48de10/9cd33e38fe38844156f50d987262e9eebc3c5cb5.png" alt=""  class="image-component"/>
<p class="text-plus-component">Protect Our Winters</p>
<p class="text-plus-component">Founded by pro snowboarder Jeremy Jones, POW works to advance non-partisan policies to protect the places and communities we love from climate change. 
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/f4833c488ab70a7e54474e3dbdb87680/1c1b24f7168499a86c2aa528d22fbe611f1a27ae.png" alt=""  class="image-component"/>

<p class="text-plus-component">Prison Yoga Project</p>
<p class="text-plus-component">Offers healing-centered, mindfulness-based yoga programs to address crime, addiction, and mental illness for historically marginalized and oppressed groups impacted by punitive incarceration. 
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/2929c60881e3817aa78ce12353076072/1720eedca32b8b1129d06d2c1da12c5c8136c770.png" alt=""  class="image-component"/>
<p class="text-plus-component">Grow Cycling</p>
<p class="text-plus-component">Provides access, education, community, and opportunity to foster diversity and create sustainable paths for cycling as a lifelong passion in underserved areas. 
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/697c44ec6139394f6a3c4f83ce4e501e/a1d55d4be29dfe248a9b49b3d4e7c783958548ed.png" alt=""  class="image-component"/>

<p class="text-plus-component">Jones Valley Teaching Farm</p>
<p class="text-plus-component">Creates K-12 school programs using food as a foundation so that young people can lead, create, and grow a healthy future for themselves and their community. 
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/2f86a7aee4b0fb1c0bd34fee2eaae91a/0651ce03f23b4b5e5ea5bbda339bf0fe9e69170d.png" alt=""  class="image-component"/>
<p class="text-plus-component">Intersectional Environmentalism</p>
<p class="text-plus-component">Works to empower a new generation of environmental activists rooted in equity and inclusion by providing educational resources that connect communities with local initiatives.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/b1ce930936c0ee5d814f2ceb3d4f9afb/d97f8822099c7d988031395a1e3395e276d4ed9d.png" alt=""  class="image-component"/>

<p class="text-plus-component">Earth Guardians</p>
<p class="text-plus-component">Educates and empowers youth groups by addressing the injustices in the environmental movement like permaculture, disinvestment in fossil fuels, civic engagement, and more.
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/b5ef0a92bb54c8853be84b6435a35e90/9838003ddb4ffcb8d1aeeb0b16ef9c7fd107179a.png" alt=""  class="image-component"/>

<p class="text-plus-component">Share Winter Foundation</p>
<p class="text-plus-component">Works to get more kids from underrepresented communities skiing and snowboarding through grantmaking and partnerships that reduce participation barriers into these inaccessible activities
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/d3da0e02c5dbf97d08eaef60550e9a03/b0c78bed1ef83d99c7c74ebf206f0bd640a57852.png" alt=""  class="image-component"/>
<p class="text-plus-component">Bahati Foundation</p>
<p class="text-plus-component">Gives access to cycling and fosters success for inner-city youth by working with schools to provide bikes, gear, and training to young riders. </p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/78ba19534b6ac2bd18c95108d2863402/0304fe6194e33eb8cca56c7843b8a16936a3399d.png" alt=""  class="image-component"/>
<p class="text-plus-component">Big City Mountaineers</p>
<p class="text-plus-component">Big City MountaineersFocuses on bringing the transformative experiences of nature to youth in low-income and underserved communities by providing free, professionally led outdoor and backcountry trips.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/2a8ecfc3c1480a202dba08c665c6195f/f347d07e6cdadab744575d71217b288c603e3e46.png" alt=""  class="image-component"/>

<p class="text-plus-component">The Venture Out Project</p>
<p class="text-plus-component">Works to dismantle barriers to outdoor access for queer and trans people, TVOP leads wilderness trips and skill-building workshops to promote inclusion in the outdoors.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/b5ad32eddf31af7bdd7df71b4211501c/54581a5a3eb60bf649c23b96e62d54422c942d4f.png" alt=""  class="image-component"/>

<p class="text-plus-component">261 Fearless</p>
<p class="text-plus-component">Leads a global network of running clubs dedicated to helping women of all ages, abilities, and backgrounds to uncover their self-worth and potential through running.
</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/06/7d186f137b84c829d3ad87316470ca75/23933d54aa437ca153d3a9ee3177a771a842f310.png" alt=""  class="image-component"/>
<p class="text-plus-component">Wings of America</p>
<p class="text-plus-component">Empowers Native youth runners by offering non-competitive extracurricular programs, as well as competitive training and mentorship for high school runners preparing for college readiness .

<p class="text-component">From targeted display units and high-impact sponsorships to contextual alignment and unique traffic drivers, our digital properties are designed to meet our active audience where they are while inspiring their non-digital passions. Think homepage takeovers with above-the-fold units, custom interactive ad executions, editorial alignment, and native newsletter placements. We have solutions for all ad budgets, all campaigns, and all partners.
</p>

<p class="text-component">Newsletters</p>
<p class="text-component">Across linear TV, digital, and CTV, Outside is the leading premium video provider for the adventure sports and lifestyle category. Award-winning, aspirational, brand-safe, and family-friendly content designed to break through to the core outdoor audience. There are immeasurable brand opportunities from product integration to helping to drive the story’s narrative and beyond. 
</p>
<p class="text-component">Our new Outside Ad Manager puts targeted advertising right at your fingertips. With this self-service tool, your ads can go live in as little as 48 hours, reaching your target customers while they’re browsing relevant content across the Outside Network. It’s easy to choose your channels, placement, budget, and audience—without having to pick up the phone or fire off an email. </p>

<p class="text-component">Turnkey social solutions for our brand partners who want to join the impactful digital conversation. Opportunities include aligning with organic social, sponsoring social event coverage, and more.</p>
<img src="https://media.ceros.com/outside-mag/images/2023/12/20/c8655fa8edda4b1e32906a4fe72fda63/link.svg" alt=""  class="image-component"/>
<p class="text-component">Meet Outside Brandworks, our award-winning in-house branded content and creative services agency. We craft tailored creative and content marketing solutions for brands big and small.

As a full-service agency, we offer a comprehensive range of services, from turnkey social media content and ad creation to bespoke event activations and branded TV series. With a talented team of editors, producers, designers, and creatives, we take a data-driven approach to developing, designing, and executing every aspect of your campaign—seamlessly across all platforms, from concept to completion.

<p class="text-component">Your Window to the Wild</p>
<img src="https://media.ceros.com/outside-mag/images/2026/02/24/bc915a0bd76c47d529f87c0f4e7eb76b/vis-toyota-logo-horiz-single-color-white.png" alt=""  class="image-component"/>
<p class="text-component">To help relaunch the Toyota 4Runner and position it as the  essential vehicle for awe-filled outdoor adventure, we launched Your Window to the Wild. Inspired by the fantastical nature of Toyota's larger campaign, we collaborated with a watercolor artist to create a hero video and custom microsite that—through the artwork, and literally through the 4Runner’s iconic rear window—take the viewer on a surreal and stunning visual journey, vividly evoking how the 4Runner can connect you to moments of awe and inspire a deeper connection to the outdoors. With this as our creative anchor, we then leveraged our  first-party outdoor intent data and multi-platform distribution to reach Toyota’s target demo.</p>
<p class="text-component">Discovering Yellowstone</p>
<img src="https://media.ceros.com/outside-mag/images/2026/02/24/305482ed7b50b5f36129bcb92f904064/imgi-1-yellowstone-logo-straight-white.svg" alt=""  class="image-component"/>
<p class="text-component">To  position Yellowstone Bourbon as a premium, purpose-driven brand with a meaningful connection to America’s national parks, we created Discovering Yellowstone, a multi-platform storytelling experience anchored by a five-part hero video series. 
      Each episode explored a different dimension of Yellowstone National Park—including adventure, wildlife, ecology, art, and conservation—through the perspective of a creator or local expert to ensure authenticity and a strong sense of place.
      An immersive microsite served as the campaign hub, bringing together the full video series with supporting editorial stories, custom photography, cocktail recipes, food pairings, and product integrations tied directly to Yellowstone Bourbon’s heritage and conservation 
</p>
<p class="text-component">The Road Less Eaten</p>
<img src="https://media.ceros.com/outside-mag/images/2026/02/24/c40bd5e13c29597d6ba66f9e288684c1/maineimgi-2-logo-1.png" alt=""  class="image-component"/>
<p class="text-component">Now entering its 4th season, The Road Less Eaten has been one of our most popular and enduring original series. In the spirit of great travel food shows like Bourdain’s Parts Unknown and Stanley Tucci’s Searching for Italy, host  Chef Biju Thomas eats and adventures across the country. For this episode, we worked with Visit Maine to showcase life in three coastal towns, including a kelp harvester, a wild blueberry farm, and more. The show was the perfect complement to a  year-long partnership  that included event sponsorship at Outside Days, a Leave No Trace-themed social video series, an editorial gravel bike test, and custom print advertorials.</p>
<p class="text-component">Masters of Craft</p>
<img src="https://media.ceros.com/outside-mag/images/2026/02/24/4f1dab4c96e7348e98b306a0fc53bd8f/aberfeldy-125-logo.png" alt=""  class="image-component"/>
<p class="text-component">To demonstrate Aberfeldy’s commitment to craft and increase brand awareness among outdoor and winter sports enthusiasts, we created Masters of Craft, a multi-platform campaign. Anchored by a sponsored segment in our 2025 Warren Miller film celebrating Scottish skiing, we also produced two custom films profiling a small-batch Scottish ski maker and an American custom fly-rod builder, highlighting the shared ethos of hand-crafted scotch and outdoor gear. All content lived on an immersive microsite alongside additional maker profiles and an interactive scotch-making timeline.  
      Watch this year’s Warren Miller film here and see all Masters of Craft content here.</p>
<p class="text-component">Ford x Google Maps TransAmerica Trail</p>
<img src="https://media.ceros.com/outside-mag/images/2025/10/23/0c1616f9d6773b58eba9adc7726fec67/readysetford-white-v1.png" alt=""  class="image-component"/>
<p class="text-component">In partnership with Google Maps, a caravan of Ford vehicles traversed the entire 5,900-mile TransAmerica Trail, making it available on Street View for the first time. To humanize the journey and showcase the Bronco, Expedition, and Ranger vehicles powering the expedition, we activated Ford ambassadors, local talent, and Google Maps experts, intercepting the expedition in Moab, Utah and Ouray, Colorado. 
      The immersive microsite we created was anchored by four hero videos and the experience featured Google Street View integration, allowing audiences to digitally explore the TransAmerica Trail alongside storytelling focused on the team, vehicles, and adventures. </p>
<p class="text-component">Park Sessions</p>
<img src="https://media.ceros.com/outside-mag/images/2025/09/22/c83f2e3ca93a55f01b412d404890d590/logo.svg" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2022/05/18/2728e0f852cfaf0d9f14319fcb65b88c/go-rv-logo-final-01-022222-with-icon-white.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2025/09/24/85dbe6db93180d190efa263c0fa92a01/t-badge-internet-tmo-horiz-ltd-use-el-rg.png" alt=""  class="image-component"/>
<p class="text-component">Park Sessions, one of our most-watched original series of 2025, was created to connect audiences to National Parks through culture, creativity, and conservation, while delivering premium original programming that aligned brand partners with purpose-driven storytelling. The 4-episode series showcased trailblazing musicians performing stripped-down sets in the outdoor spaces that inspire them most, while also elevating Indigenous voices, wilderness experts, and local stewards. 
      We worked with one nonprofit partner, Parks Project, and three sponsors—Go RVing, Merrell, and T- Mobile—to bring the series to life, including product and brand integration and the creation of custom assets from each of the episodes. 
</p>

<p class="text-component">Branded Content Campaign Wins Regional Emmy 
</p>
<p class="text-component">We’re beyond pleased to announce that the Visit Denver 'Basecamp Denver' series took home the 2023 Heartland Emmy for best short-form branded content! We’re really proud of this collaboration with our client, VISIT DENVER, The Convention & Visitors Bureau, and Director, Amy Sabreen. We are honored to have been among our fellow nominees. Check out all the episodes here.</p>

<p class="text-component">Outside/Case Study</p>
<p class="text-component">Cheeky Collaboration with  Bear Naked Captures Attention 
</p>
<p class="text-component">We teamed up with Bear Naked Granola to encourage hikers to do what feels the most natural to them. Capturing the attention of AdWeek, AdAge, Marketing Dive, and Reel Chicago and our audience alike. Read all about it! 

With a timely launch to celebrate “National Nude Day” the strategically playful program highlighted a group of 4 creators in the wild, using the Gaia GPS app to (un)officially review which trails are nude friendly or not, while wearing the “Bear Naked Belt” and documenting their adventures.

The campaign included a diverse range of tactics to capture audiences across the Outside Network, from a highly-clickable interactive HUB housing custom and creator content plus a full length 3-minute video, to OutsideTV placements, and an equally robust digital campaign.

The program as a whole over-delivered by an average +13% with some key tactics such as the interactive HUB seeing an over-delivery of +418% and social awareness at +40% across native channels. The campaign showed similar success across each KPI we were tasked with achieving. 
</p>
<img src="https://media.ceros.com/outside-mag/images/2024/02/02/684d45c13f11dc8a97120b149eceb070/screen-shot-2024-02-01-at-11-25-36-pm.png" alt=""  class="image-component"/>
<p class="text-component">Outside/News</p>
<p class="text-component">Outside Interactive, Inc. Announces Launch of RUN, a New Running Media Platform  
</p>
<p class="text-component">Outside Interactive, Inc., the world’s leading creator of active lifestyle content, services, events, and experiences, launched a new running media platform, RUN, today. Built on the legacy of more than fifty years of experience in running media across Outside Magazine, Trail Runner, Podium Runner, and Women’s Running, RUN combines and elevates all aspects of these iconic brands with the goal of empowering people to run.

“Whether you’re quietly clocking miles before work, a seasoned marathoner looking to find an edge, or simply want to start running and aren’t sure where to begin, RUN is a brand dedicated to you,” says Christopher Keyes, vice president of the Outdoor Group at Outside Inc. “Powered by our growing run-dedicated editorial teams at Outside, Trail Runner, and Women’s Running, we’ll be expanding our world-class coverage to bring you the very best storylines, training content, culture, and analysis from across the world of running.”

Link to Press Release
</p>
<img src="https://media.ceros.com/outside-mag/images/2024/04/02/0cb959081efb40bc6d85ab31659577b1/screen-shot-2024-04-02-at-9-11-35-am.png" alt=""  class="image-component"/>
<p class="text-component">Outside/News</p>
<p class="text-component">The Summit to Pack a Punch at the Outside Festival </p>
<p class="text-component">“Outside and partners see a future where the inaugural festival can not only be the premier annual destination for the everyday outdoor enthusiasts, but also for industry global outdoor thought leaders that are working on new ideas to cultivate creativity and build a better, and more inclusive future for the outdoors all outside, ” said Robin Thurston, CEO of Outside.

Acting as a true kick-off to one of the most anticipated events of the summer, THE SUMMIT will take place at the Denver Art Museum and serve as a day of inspiration and education for seasoned and aspiring outdoor industry professionals to join critical conversations that are paramount to the future of the outdoor industry.

“The outdoor industry is at a pivotal moment where, given the right resources and connections, it has the potential to flourish into a powerful force in not only economic development and conservation but also in stewardship, workforce development, and the intersection between public health and wellness, ” said Luis Benitez, Trust of Public Land’s Chief Impact Officer. “The Outside Festival and THE SUMMIT are building a framework where combined voices and interests can blossom.”

Attendees can expect a robust line-up of speakers from political and business sectors aimed at educating and inspiring across three critical tracks: sustainability (climate and conservation), inclusion (access and equity), and creativity (marketing, leadership, and trends). Conor Hall, leading the charge for Colorado’s Outdoor Recreation Industry, underscores the vital economic contribution of the outdoors to the state, “(the outdoor industry) amounts to over $62 billion and provides employment for more than 500,000 individuals, constituting 18% of Colorado’s workforce. The necessity of amplifying the industry’s voice, in the Outside Festival and now THE SUMMIT serves as a platform to unite and empower both industry players and the community they serve.”

Early-bird tickets to THE SUMMIT that include all meals and a two-day GA pass to the Outside Festival start at $495 for a limited time. In addition, also held on the same day, Friday, May 31, industry retailers, media, and other VIPs won’t want to miss The Big Gear Show and (e)revolution Show industry day to check out up-and-coming gear, attend industry-specific education sessions and stick around for an industry social gathering. Attendance is FREE. For more information and to register, please visit e-revolution.bike or thebiggearshow.com.

Sponsors for THE SUMMIT include the Colorado Outdoor Recreation Industry Office, the Denver Art Museum, The Conservation Alliance, and the Trust for Public Land.
</p></div>

<p class="text-component">When Toyota wanted to position the all-new Tundra as the ultimate adventure truck to outdoor consumers, we shifted into gear with an integrated approach across the Outside Network that reached millions. Between custom video, editorial, podcasts, social, and even a literal pocket guide, we helped millions see themselves in the driver’s seat.
</p>
<img src="https://media.ceros.com/outside-mag/images/2024/01/29/34feee4a30378a00ff0c75d91053bf4e/fieldguide.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2024/01/29/6d8e36f1da3b9e45d919fdf59dd034b6/screen-shot-2024-01-26-at-1-15-1.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/outside-mag/images/2024/01/27/609d721241999be7da1621d9a1a05324/workwithusbutton.svg" alt=""  class="image-component"/>
<p class="text-component">We loaded a pocket-sized print guide with how-to’s for outdoor adventures—all made possible by the Toyota Tundra. On top of reaching more than 1 million subscribers by including the guide in Outside magazine, we featured 12 high-impact print placements over 4 issues of Outside and Backpacker.


</p>
<p class="text-component">Print Field Guide</p>
<img src="https://media.ceros.com/outside-mag/images/2024/01/27/609d721241999be7da1621d9a1a05324/workwithusbutton.svg" alt=""  class="image-component"/>
<p class="text-component">We wanted to put the Tundra to the test in challenging outdoor environments—and bring the results to our audience. Enter a six-part custom video and editorial series delivered in one interactive online hub. By letting our audience explore the Tundra for themselves, we delivered thousands of hits directly to Toyota pages and millions of impressions.</p>
<p class="text-component">Interactive Digital Experience</p>
<img src="https://media.ceros.com/outside-mag/images/2024/01/27/609d721241999be7da1621d9a1a05324/workwithusbutton.svg" alt=""  class="image-component"/>
<p class="text-component">Show, don’t tell. We featured the Toyota Tundra in “Beat Monday,” an Outside original series following the hardcore weekend adventures of athletes Mike Chambers and Jason Antin—helping audiences envision how the Tundra could fit into their own adventurous lives.



</p>

<p class="text-component">Hiking is a passion for the Outside Network audience. But what about hiking nude? We captured the attention of millions by teaming up with Bear Naked Granola to create the Naked Trails campaign. This cheeky collaboration highlighted four creators using the Gaia GPS app to (un)officially review which trails are nude-friendly or not—fueled by Bear Naked granola, of course. With an interactive content hub featuring custom and creator content, a three-minute video, and a robust digital campaign, Naked Trails over-delivered across channels and even drew coverage from AdWeek, AdAge, Marketing Dive, and Reel Chicago.
</p>
<img src="https://media.ceros.com/outside-mag/images/2024/01/27/609d721241999be7da1621d9a1a05324/workwithusbutton.svg" alt=""  class="image-component"/>
<p class="text-component">This highly-clickable web experience featured all things Naked Trails—from a three-minute video and custom articles to info on Gaia GPS and links to shop for Bear Naked Granola. The results? This hub overdelivered by more than 418%, with average engaged time on site at 0:52, significantly above the network benchmark, and more than 7.4k clicks to Bear Naked sites. When it comes to blazing naked trails, our audience is here for it!</p>
