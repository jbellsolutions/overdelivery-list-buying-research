<p class="text-plus-component">High-Impact Experiential Activations at Brookfield Place</p>
<img src="https://media.ceros.com/everyday-health/images/2025/09/03/5426550af2e130da44fce8f0a1219b55/ford.png" alt=""  class="image-component"/>
<p class="text-plus-component">The Ask</p>
<p class="text-plus-component">After a successful 2022 event partnership, Brookfield Properties returned to theSkimm in 2023 with the goal of driving increased foot traffic to the retailers and shops at Brookfield Place during the competitive holiday season. They wanted to position Brookfield Place as both a premier shopping destination and a festive, family-friendly cultural hub.</p>
<img src="https://media.ceros.com/everyday-health/images/2025/09/03/d4cf84a50efefeed7fc748bad12bf5bf/frame-17908.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/everyday-health/images/2025/09/04/386276221d62cdf8f91d582c6357460a/frame-17909.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/everyday-health/images/2025/09/03/0e06e1726b64bf5c31eb0ce89329cf68/frame-17911.png" alt=""  class="image-component"/>
<img src="https://media.ceros.com/everyday-health/images/2025/09/03/86bd7da81d6c2194106c2884d35419d4/bevents-x-skimms-bflp-final-26-1.png" alt=""  class="image-component"/>
<p class="text-plus-component">The Solution</p>
<p class="text-plus-component">We partnered with Brookfield Place to create Winter Wanderland—an immersive, social-first activation designed to turn the holiday shopping season into a festive destination experience. The campaign featured a series of interactive, co-branded photo stations strategically placed throughout the property to encourage exploration into underutilized areas, maximizing both foot traffic and shopper flow.To celebrate the launch and build buzz, we partnered with tenant Devon & Blakely to host a hot cocoa cart and holiday postcard pop-up, offering shoppers complimentary treats while inviting them to send personalized postcards to friends and family. These touchpoints extended awareness of Brookfield Place beyond the mall, positioning it as both a shopping hub and a lifestyle destination for the entire family.</p>
<p class="text-plus-component">The Results</p>
<p class="text-plus-component">The activation was amplified across theSkimm’s ecosystem with a robust, multi-channel promotion strategy. A Skimm native article, “12 Festive Things to Do at Brookfield Place,” resonated deeply with our audience, driving 10x engagement vs. benchmark CTR. A geo-targeted dedicated email with a live countdown created urgency, delivering 10x higher CTOR than benchmarks. Custom newsletter placements—including But First sponsorships, “Save the Date,” and “On Our Radar” sections—outperformed benchmarks by +29%, while Instagram stories and social amplification reached Skimm’rs at scale, drawing locals, tourists, and visitors alike to Brookfield Place during the holidays and beyond.</p>
